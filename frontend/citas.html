<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citas | VetCitas</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendors/boldo/theme.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-vet sticky-top" aria-label="Navegación principal">
      <div class="container">
        <a class="navbar-brand" href="index.html"><i class="fa-solid fa-paw logo-icono"></i> VetCitas</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav-principal" aria-controls="nav-principal" aria-expanded="false" aria-label="Abrir menú">
          <i class="fa-solid fa-bars text-white fs-2"></i>
        </button>
        <div class="collapse navbar-collapse" id="nav-principal">
          <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="citas.html">Citas</a></li>
            <li class="nav-item"><a class="nav-link" href="mascotas.html">Mascotas</a></li>
            <li class="nav-item mt-2 mt-lg-0 ms-lg-3"><a class="btn btn-success text-dark px-4 py-2" href="nueva-cita.html">Agendar cita</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="contenido">
    <div id="mensajes" aria-live="polite"></div>

    <section class="hero hero-pagina">
      <img class="hero-fondo" src="img/hero-bg.png" alt="">
      <div class="container position-relative">
        <h1 class="hero-titulo">Citas</h1>
        <p class="hero-texto mb-0">Consulta, filtra, modifica o cancela las citas agendadas.</p>
      </div>
    </section>

    <section class="seccion">
      <div class="container">
        <!-- Filtros -->
        <form id="form-filtros" class="tarjeta-vet filtros mb-4" role="search" aria-label="Filtrar citas">
          <div class="row g-3 align-items-end">
            <div class="col-md-5">
              <label class="form-label" for="filtro-texto">Buscar</label>
              <input type="search" id="filtro-texto" class="form-control" placeholder="Nombre de la mascota o del dueño" autocomplete="off">
            </div>
            <div class="col-sm-6 col-md-3">
              <label class="form-label" for="filtro-estado">Estado</label>
              <select id="filtro-estado" class="form-select">
                <option value="todas">Todos los estados</option>
                <option value="pendiente">Pendiente</option>
                <option value="atendida">Atendida</option>
                <option value="cancelada">Cancelada</option>
              </select>
            </div>
            <div class="col-sm-6 col-md-3">
              <label class="form-label" for="filtro-fecha">Fecha</label>
              <input type="date" id="filtro-fecha" class="form-control">
            </div>
            <div class="col-md-1 d-grid">
              <button type="reset" class="btn-icono" title="Limpiar filtros" aria-label="Limpiar filtros"><i class="fa-solid fa-rotate-left"></i></button>
            </div>
          </div>
          <div class="chips mt-3" id="chips-rango" role="group" aria-label="Rango de fechas">
            <button type="button" class="chip activo" data-rango="todas" aria-pressed="true">Todas</button>
            <button type="button" class="chip" data-rango="hoy" aria-pressed="false">Hoy</button>
            <button type="button" class="chip" data-rango="proximas" aria-pressed="false">Próximas</button>
            <button type="button" class="chip" data-rango="pasadas" aria-pressed="false">Pasadas</button>
          </div>
        </form>

        <!-- Resultado -->
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
          <p id="contador-citas" class="mb-0" aria-live="polite"></p>
          <a href="nueva-cita.html" class="btn btn-dark px-4 py-2"><i class="fa-solid fa-plus me-2"></i>Nueva cita</a>
        </div>

        <div class="tabla-vet">
          <table class="table">
            <thead>
              <tr>
                <th scope="col">Fecha</th>
                <th scope="col">Hora</th>
                <th scope="col">Mascota</th>
                <th scope="col">Dueño</th>
                <th scope="col">Motivo</th>
                <th scope="col">Estado</th>
                <th scope="col" class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-citas"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer class="pie">
    <div class="container d-md-flex justify-content-between align-items-center text-center text-md-start">
      <p class="pie-logo mb-2 mb-md-0"><i class="fa-solid fa-paw"></i> VetCitas</p>
      <p class="mb-0">&copy; <span id="anio-actual"></span> VetCitas · PTEC103 · Diseño basado en <a href="https://themewagon.com/themes/boldo/" target="_blank" rel="noopener">Boldo de ThemeWagon</a></p>
    </div>
  </footer>

  <script src="vendors/bootstrap/bootstrap.min.js"></script>
  <script src="vendors/fontawesome/all.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/citas.js"></script>
</body>
</html>
